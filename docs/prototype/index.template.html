<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>colour-demo · colour-science 0.4.7 全能力演示（原型）</title>
<style>
  :root{
    --bg:#F6F6F3; --card:#FFFFFF; --ink:#15161A; --ink-2:#555A63; --ink-3:#8B9099;
    --line:#E5E5DF; --line-2:#D3D3CB; --accent:#3B82F6; --accent-ink:#1D4ED8;
    --warm:#E76F51; --green:#2A9D8F; --gold:#E9C46A;
    --radius:12px; --radius-sm:8px;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    --shadow:0 1px 2px rgba(20,22,26,.04),0 10px 28px -14px rgba(20,22,26,.14);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
  button{font-family:inherit;font-size:inherit;cursor:pointer}
  h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}
  p{margin:0}
  code,.mono{font-family:var(--mono);font-size:12.5px}

  /* shell */
  .topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:11px 20px;
    background:rgba(246,246,243,.9);backdrop-filter:saturate(180%) blur(14px);border-bottom:1px solid var(--line)}
  .brand{display:flex;align-items:center;gap:10px}
  .brand-mark{width:26px;height:26px;border-radius:8px;
    background:conic-gradient(from 210deg,#264653,#2A9D8F,#E9C46A,#F4A261,#E76F51,#264653);
    box-shadow:inset 0 0 0 1px rgba(0,0,0,.06)}
  .brand-name{font-weight:650;letter-spacing:-.02em}
  .brand-sub{color:var(--ink-3);font-size:12px;margin-left:2px}
  .spacer{flex:1}
  .chip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;
    border:1px solid var(--line-2);background:var(--card);color:var(--ink-2);font-size:12px;white-space:nowrap}
  .chip b{font-weight:600}
  .chip--accent{border-color:#C7DBFB;background:#EEF4FE;color:var(--accent-ink)}
  .chip--warm{border-color:#F3D3C9;background:#FDF1ED;color:#A63F24}
  .dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.75}

  .app{display:grid;grid-template-columns:250px minmax(0,1fr);align-items:start}
  .side{position:sticky;top:57px;height:calc(100vh - 57px);overflow:auto;padding:16px 10px 40px;border-right:1px solid var(--line)}
  .side-group{margin-bottom:14px}
  .side-label{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);padding:0 10px 5px}
  .nav-btn{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:6px 10px;border:0;border-radius:var(--radius-sm);
    background:transparent;color:var(--ink-2);font-size:13px}
  .nav-btn:hover{background:#EDEDE8;color:var(--ink)}
  .nav-btn[aria-current="page"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow);font-weight:600}
  .nav-btn[aria-current="page"] .nav-index{color:var(--accent)}
  .nav-index{font-family:var(--mono);font-size:11px;color:var(--ink-3);width:20px;flex:none}
  .nav-phase{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--ink-3)}
  .nav-pending{width:5px;height:5px;border-radius:50%;border:1px solid #C9A227;margin-left:4px;flex:none}
  .side-foot{padding:12px 10px 0;color:var(--ink-3);font-size:11px;line-height:1.7;border-top:1px solid var(--line);margin-top:6px}

  main{padding:24px 32px 90px;max-width:1180px}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
  .panel-head h1{font-size:25px;letter-spacing:-.025em}
  .lead{color:var(--ink-2);max-width:76ch;margin-top:8px}
  .panel-head{margin-bottom:18px}
  .crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--ink-3);margin-bottom:10px}
  .crumbs a{color:var(--ink-2);text-decoration:none}
  .crumbs a:hover{color:var(--accent-ink);text-decoration:underline}
  .pro-name{font-size:12px;color:var(--ink-3);margin:2px 0 6px}
  .answer-tag{display:flex;gap:8px;align-items:baseline;margin-top:10px;padding:8px 11px;background:#EEF4FE;border-radius:8px}
  .answer-tag span{font-size:11px;color:var(--accent-ink);white-space:nowrap}
  .answer-tag b{font-size:14px;font-weight:600;color:var(--ink)}
  .read-list{margin:0;padding-left:20px;display:grid;gap:6px;font-size:13px;line-height:1.55}
  .read-list li::marker{color:var(--accent)}
  .next-row{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0 6px}
  .beginner-head .lead{max-width:72ch}

  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden}
  .card-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding:12px 16px;border-bottom:1px solid var(--line);background:#FCFCFA}
  .card-head h2{font-size:13.5px}
  .card-head .hint{color:var(--ink-3);font-size:12px}
  .card-body{padding:14px 16px}
  .card-foot{padding:9px 16px;border-top:1px solid var(--line);background:#FCFCFA;color:var(--ink-3);font-size:12px}

  .controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px 14px;padding:12px 16px;border-bottom:1px solid var(--line);background:#FBFAF7}
  .field{display:grid;gap:4px;min-width:0}
  .field>span{font-size:11px;color:var(--ink-3)}
  input[type=text],select{height:31px;padding:0 9px;border:1px solid var(--line-2);border-radius:7px;background:#fff;color:var(--ink);
    font-family:var(--mono);font-size:12.5px;width:100%;min-width:0}
  input[type=text]:focus,select:focus{outline:2px solid #C7DBFB;outline-offset:1px;border-color:var(--accent)}
  .color-field{display:flex;gap:8px;align-items:center}
  input[type=color]{width:38px;height:31px;padding:2px;border:1px solid var(--line-2);border-radius:7px;background:#fff;flex:none}
  input[type=range]{width:100%;accent-color:var(--accent)}
  .ctrl-note{padding:8px 16px;border-bottom:1px solid var(--line);background:#FBFAF7;color:var(--ink-3);font-size:11.5px}

  /* live API 层 */
  .chip--ok{background:#E9F6F3;border:1px solid #C6E7E0;color:#1B6B5F}
  .field--run{align-content:end}
  .field--run button{height:31px;padding:0 14px;border:1px solid #1B1D21;border-radius:7px;background:#1B1D21;color:#fff;
    font-size:12.5px;cursor:pointer}
  .field--run button:hover{background:#33363C}
  .range-row{display:flex;align-items:center;gap:9px}
  .range-row output{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);min-width:34px;text-align:right}
  .live-out{display:grid;gap:0;margin:14px 0 0}
  .live-out:empty{display:none}
  .snapshot{margin-top:14px;border-top:1px solid var(--line);padding-top:6px}
  .snapshot>summary,.trace>summary{cursor:pointer;font-size:11.5px;color:var(--ink-3);padding:5px 0;list-style:none}
  .snapshot>summary::-webkit-details-marker,.trace>summary::-webkit-details-marker{display:none}
  .snapshot>summary:before,.trace>summary:before{content:"▸ ";color:var(--ink-3)}
  .snapshot[open]>summary:before,.trace[open]>summary:before{content:"▾ "}
  .trace{margin-top:10px}
  .trace .code{margin-top:6px}

  /* generic */
  .kv{width:100%;border-collapse:collapse}
  .kv td{padding:6px 0;border-bottom:1px solid var(--line);vertical-align:top}
  .kv tr:last-child td{border-bottom:0}
  .kv td.k{color:var(--ink-2);white-space:nowrap;padding-right:14px;width:34%}
  .kv td.v{font-family:var(--mono);font-size:12.5px;word-break:break-word}
  .kv td.n{color:var(--ink-3);font-size:12px;padding-left:14px}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
  .stat{padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#FCFCFA}
  .stat b{display:block;font-size:17px;font-family:var(--mono);letter-spacing:-.02em}
  .stat span{font-size:11.5px;color:var(--ink-3)}
  .tag{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 7px;border-radius:5px;font-size:11px;
    background:#F1F1EC;color:var(--ink-2);border:1px solid var(--line);white-space:nowrap}
  .tag--m1{background:#EEF4FE;border-color:#C7DBFB;color:#1D4ED8}
  .tag--m2{background:#E9F6F3;border-color:#C6E7E0;color:#1B6B5F}
  .tag--m3{background:#FBF1E7;border-color:#EEDBC6;color:#8A5A24}
  .tag--m4{background:#F2EDFB;border-color:#DCD0F5;color:#5B3E9B}
  .tag--pending{background:#FBF7EA;border-color:#EDE2C4;color:#6B5620}
  .muted{color:var(--ink-3)}
  .small{font-size:12px}
  .table-wrap{overflow:auto;max-height:560px;border:1px solid var(--line);border-radius:9px}
  table.data{width:100%;border-collapse:collapse;font-size:12.5px}
  table.data th{position:sticky;top:0;z-index:1;background:#FCFCFA;text-align:left;font-weight:500;color:var(--ink-3);
    font-size:11.5px;padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
  table.data td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top;word-break:break-word}
  table.data tr:hover td{background:#FCFCFA}
  table.data td.mono{font-family:var(--mono);font-size:12px;color:var(--ink-2);white-space:nowrap}
  .table-note{padding:8px 2px 0;color:var(--ink-3);font-size:11.5px}

  /* matrix */
  .matrix-head{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
  .matrix-head i{width:16px;height:16px;border-radius:4px;border:1px solid rgba(0,0,0,.12);display:block}
  table.matrix{border-collapse:separate;border-spacing:3px;font-family:var(--mono);font-size:12px}
  table.matrix th{font-family:var(--sans);font-weight:500;font-size:11px;color:var(--ink-3);padding:2px 6px;text-align:center}
  table.matrix td{width:58px;height:34px;text-align:center;border-radius:6px;border:1px solid rgba(0,0,0,.05)}
  table.matrix td.diag{background:repeating-linear-gradient(45deg,#F4F4F0,#F4F4F0 4px,#EDEDE7 4px,#EDEDE7 8px);color:var(--ink-3)}

  /* swatches */
  .sw-grid{display:grid;gap:8px}
  .sw{display:grid;gap:4px}
  .sw-color{height:44px;border-radius:7px;border:1px solid rgba(0,0,0,.08)}
  .sw-hex{font-family:var(--mono);font-size:10.5px;color:var(--ink-2);text-align:center}
  .sw-sub{font-size:10px;color:var(--ink-3);text-align:center}

  /* strips */
  .strip-block{display:grid;gap:7px;padding:12px 0;border-bottom:1px dashed var(--line)}
  .strip-block:first-child{padding-top:0}
  .strip-block:last-child{border-bottom:0;padding-bottom:0}
  .strip-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
  .strip-head h3{font-size:13px}
  .strip-head .note{color:var(--ink-3);font-size:11.5px}
  .strip-head .stats{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
  .bar{height:24px;border-radius:7px;border:1px solid rgba(0,0,0,.07)}
  .steps{display:grid;gap:3px}
  .step{height:20px;border-radius:3px;border:1px solid rgba(0,0,0,.05)}

  /* chart */
  /* SVG 用 viewBox 等比缩放：窄屏时字号会被一起缩小，故给最小宽度、在容器内横向滚动。
     .chart-wrap 必须 min-width:0，否则 svg 的最小宽度会撑开单列网格、把整页裁掉。 */
  .chart-wrap{display:block;overflow-x:auto;min-width:0;max-width:100%}
  .chart{width:100%;height:auto;display:block;max-width:100%;min-width:620px}
  .chart text{font-family:var(--mono);font-size:9px;fill:var(--ink-3)}
  .chart .legend{font-family:var(--sans);font-size:10px}
  .chart-caption{color:var(--ink-3);font-size:11.5px}
  .fig{margin:0;display:grid;gap:6px;justify-items:center}
  .fig img{max-width:100%;height:auto;display:block}
  .fig figcaption{color:var(--ink-3);font-size:11.5px;text-align:center}

  /* callouts */
  .note-box{display:flex;gap:9px;padding:11px 13px;border-radius:9px;font-size:12px;line-height:1.65}
  .note-box .b{font-weight:600;flex:none}
  .note-info{background:#F1F6FE;border:1px solid #D3E3FA;color:#1B3A6B}
  .note-warn{background:#FBF7EA;border:1px solid #EDE2C4;color:#6B5620}

  /* json */
  .code{position:relative;background:#1B1D21;color:#E6E6E3;border-radius:9px}
  .code pre{margin:0;padding:12px 14px;overflow:auto;font-family:var(--mono);font-size:11.5px;line-height:1.6;max-height:340px}
  .code .copy{position:absolute;top:8px;right:8px;border:1px solid #3A3D44;background:#262A30;color:#CFD2D6;border-radius:6px;font-size:11px;padding:2px 8px}
  .k-str{color:#93D6A0}.k-num{color:#FFC46B}.k-key{color:#8CB8FF}

  /* chain + cards */
  .chain{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
  .chain-node{position:relative;padding:11px;border-radius:10px;border:1px solid var(--line);background:#FCFCFA}
  .chain-node strong{display:block;font-size:12.5px;margin-bottom:3px}
  .chain-node p{font-size:11px;color:var(--ink-3);line-height:1.5}
  .chain-bar{height:3px;border-radius:2px;margin-bottom:8px}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
  .mini{padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#FCFCFA;display:grid;gap:4px}
  .mini h3{font-size:12.5px}
  .mini p{font-size:11.5px;color:var(--ink-2);line-height:1.5}
  .mini code{color:var(--ink-3);font-size:11px}

  footer.page-foot{margin-top:22px;color:var(--ink-3);font-size:12px;line-height:1.8;border-top:1px solid var(--line);padding-top:12px}
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(8px);background:#1B1D21;color:#fff;
    padding:7px 13px;border-radius:8px;font-size:12.5px;opacity:0;pointer-events:none;transition:.18s;z-index:60}
  .toast.show{opacity:1;transform:translateX(-50%)}
  @media (max-width:900px){
    .app{grid-template-columns:1fr}
    .side{position:static;height:auto;border-right:0;border-bottom:1px solid var(--line)}
    main{padding:18px}
  }
  /* ===== 新手外壳（W2） ===== */
  [hidden]{display:none!important}
  main:focus{outline:none}
  a.nav-btn{text-decoration:none}
  .topnav{display:flex;align-items:center;gap:2px;flex-wrap:wrap}
  .topnav-link{padding:5px 9px;border-radius:999px;color:var(--ink-2);text-decoration:none;font-size:12.5px;white-space:nowrap}
  .topnav-link:hover{background:#EDEDE8;color:var(--ink)}
  .topnav-link[aria-current="page"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow);font-weight:600}
  html[data-mode="expert"] .topnav{display:none}
  .brand{text-decoration:none;color:inherit;flex:none}
  .brand-name{display:block;line-height:1.15}
  .brand-sub{display:block;margin-left:0;font-size:11px;line-height:1.2}
  .mode-switch{display:inline-flex;align-items:center;flex:none;padding:2px;border:1px solid var(--line-2);border-radius:999px;background:var(--card)}
  .mode-switch button{border:0;background:transparent;border-radius:999px;padding:4px 10px;font-size:12px;color:var(--ink-3);white-space:nowrap}
  .mode-switch button[aria-pressed="true"]{background:#1B1D21;color:#fff}
  html[data-mode="beginner"] .side{display:none}
  html[data-mode="beginner"] .app{grid-template-columns:minmax(0,1fr)}
  html[data-mode="beginner"] main{width:100%;max-width:980px;margin:0 auto;padding:30px 24px 100px}
  html[data-mode="beginner"] #chip-coverage,html[data-mode="beginner"] #chip-progress{display:none}

  .hero{padding:10px 0 26px}
  .hero h1{font-size:38px;line-height:1.15;letter-spacing:-.035em}
  .hero-sub{font-size:17px;color:var(--ink-2);max-width:62ch;margin-top:12px}
  .hero-meta{font-size:12px;color:var(--ink-3);margin-top:10px}
  .task-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
  .task-card{display:flex;flex-direction:column;gap:8px;padding:16px;background:var(--card);
    border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);
    text-decoration:none;color:inherit;transition:transform .12s ease,border-color .12s ease}
  .task-card:hover{transform:translateY(-2px);border-color:#C7DBFB}
  .task-card-top{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--ink-3)}
  .task-card h2{font-size:16px;letter-spacing:-.01em}
  .task-card p{font-size:13px;color:var(--ink-2);flex:1}
  .task-go{font-size:12.5px;color:var(--accent-ink);font-weight:600}
  .task-no{color:var(--accent)}
  .home-links{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:22px}
  .home-link{display:block;padding:14px 16px;border:1px solid var(--line);border-radius:var(--radius);
    background:var(--card);text-decoration:none;color:inherit}
  .home-link:hover{border-color:#C7DBFB}
  .home-link b{display:block;font-size:14px}
  .home-link span{font-size:12px;color:var(--ink-3)}

  .verdict{border:1px solid var(--line);border-left:4px solid var(--green);border-radius:var(--radius);
    background:var(--card);box-shadow:var(--shadow);padding:16px 18px;margin-bottom:14px}
  .verdict--warn{border-left-color:#C08A2E;background:#FFFDF6}
  .verdict--bad{border-left-color:var(--warm);background:#FFF9F6}
  .verdict-title{font-size:11px;letter-spacing:.08em;color:var(--ink-3)}
  .verdict-line{display:flex;align-items:baseline;gap:10px;margin-top:6px;flex-wrap:wrap}
  .verdict-value{font-family:var(--mono);font-size:30px;letter-spacing:-.03em}
  .verdict-band{font-size:12.5px;padding:2px 8px;border-radius:999px;background:#EDEDE8;color:var(--ink-2)}
  .verdict-say{margin-top:6px;color:var(--ink-2);font-size:13.5px}
  .verdict-extra{margin-top:8px;font-size:13px}

  .color-list{display:grid;gap:8px;margin-bottom:12px}
  .color-row{display:flex;gap:8px;align-items:center}
  .color-row input[type=color]{width:44px;height:34px}
  .color-row .hex-input{flex:1;font-family:var(--mono)}
  .hex-input.is-bad{border-color:var(--warm);outline:2px solid #F3D3C9}
  .btn-ghost{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border:1px solid var(--line-2);
    border-radius:7px;background:var(--card);color:var(--ink-2);font-size:12px;text-decoration:none}
  .btn-ghost:hover{border-color:var(--accent);color:var(--accent-ink)}
  .btn-primary{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:7px;background:var(--accent);color:#fff;font-size:12.5px;font-weight:600;text-decoration:none}
  .btn-primary:hover{background:var(--accent-ink)}
  .btn-ghost:disabled{opacity:.45;cursor:not-allowed}
  .btn-icon{width:30px;height:30px;border:1px solid var(--line-2);border-radius:7px;background:var(--card);color:var(--ink-3)}
  .btn-icon:disabled{opacity:.4;cursor:not-allowed}
  .preset-row{display:flex;gap:6px;flex-wrap:wrap}
  .preset{padding:5px 10px;border:1px solid var(--line-2);border-radius:999px;background:var(--card);
    font-size:12px;color:var(--ink-2)}
  .preset[aria-pressed="true"]{background:#1B1D21;color:#fff;border-color:#1B1D21}

  .steps{list-style:none;padding:0;margin:14px 0 0;display:flex;gap:14px;flex-wrap:wrap;color:var(--ink-2);font-size:12.5px}
  .steps li{display:flex;align-items:center;gap:7px}
  .steps li span{width:20px;height:20px;border-radius:50%;background:#EDEDE8;color:var(--ink-2);
    display:grid;place-items:center;font-family:var(--mono);font-size:11px;flex:none}
  .steps--big{display:grid;gap:12px;font-size:14px}
  .task-grid-2{display:grid;grid-template-columns:minmax(0,370px) minmax(0,1fr);gap:16px;align-items:start}
  .task-result{min-height:120px}
  .task-controls .field{margin-top:10px}

  .principles{margin-top:18px;border:1px solid var(--line);border-radius:var(--radius);background:var(--card)}
  .principles>summary{cursor:pointer;padding:12px 16px;font-size:12.5px;color:var(--ink-2);list-style:none}
  .principles>summary:before{content:"▸ ";color:var(--ink-3)}
  .principles[open]>summary:before{content:"▾ "}
  .principles-body{padding:0 16px 16px;color:var(--ink-2);font-size:13px}

  .term{display:inline;padding:0;border:0;background:none;color:inherit;font:inherit;

  .term:hover{color:var(--accent-ink);border-bottom-color:var(--accent)}
  .term-pop{position:absolute;z-index:60;background:var(--card);border:1px solid var(--line-2);border-radius:10px;

  .glossary-term b{font-size:15px}
  .glossary-term span{color:var(--ink-3);font-size:12px;margin-left:8px}
  .glossary-item p{margin-top:4px;font-size:13px}
  .glossary-link{font-size:12px;color:var(--accent-ink)}

  .ref-tools{display:flex;align-items:center;gap:4px;margin:14px 0 4px;flex-wrap:wrap}

  .ref-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
  .ref-card{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border:1px solid var(--line);

  .ref-card:hover{border-color:#C7DBFB}
  .ref-no{font-family:var(--mono);font-size:10.5px;color:var(--ink-3)}
  .ref-sub{font-size:11.5px;color:var(--ink-3)}

  .note-box{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;padding:10px 12px;border-radius:9px;
    border:1px solid var(--line);background:#FCFCFA;font-size:12.5px;margin:10px 0}
  .note-box .b{font-weight:600}
  .note-info{border-color:#C7DBFB;background:#F5F9FF}
  .note-warn{border-color:#F3D3C9;background:#FFF7F4}
  .beginner-note{display:flex;gap:10px;flex-wrap:wrap;padding:10px 12px;margin-bottom:16px;
    border:1px dashed var(--line-2);border-radius:9px;background:#FBFAF7;font-size:12px;color:var(--ink-3)}
  .noscript{max-width:760px;margin:40px auto;padding:20px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius)}

  @media(max-width:900px){.task-grid-2{grid-template-columns:1fr}.home-links{grid-template-columns:1fr}}
  .single-color{display:flex;gap:8px;align-items:center}
  .single-color input[type=color]{width:44px;height:34px}
  .single-color .hex-input{flex:1;font-family:var(--mono)}
  #task-fields .field+.field{margin-top:10px}
  .purity-list{display:grid;gap:10px}
  .purity-item{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:9px;align-items:center}
  .purity-sw{width:26px;height:26px;border-radius:6px;border:1px solid var(--line)}
  .meter{height:8px;border-radius:999px;background:#EDEDE8;overflow:hidden;margin-bottom:3px}
  .meter i{display:block;height:100%;background:var(--accent)}
  .compare-pair{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
  .compare-pair:last-child{border-bottom:0;padding-bottom:0}
  .compare-item{display:grid;gap:4px;font-size:12px;color:var(--ink-2)}
  .compare-item span{font-size:11px;color:var(--ink-3)}
  .compare-item code{font-family:var(--mono);font-size:12px}
  .compare-item em{font-style:normal;font-size:11px;color:var(--ink-3)}
  .compare-sw{height:34px;border-radius:7px;border:1px solid var(--line)}
  .compare-arrow{color:var(--ink-3)}
  .gradient-row{padding:9px 0;border-bottom:1px dashed var(--line)}
  .gradient-row:last-child{border-bottom:0;padding-bottom:0}
  .gradient-row.is-active .gradient-head b{color:var(--accent-ink)}
  .gradient-head{display:flex;align-items:center;gap:8px;margin-bottom:4px}
  .gradient-head b{font-size:13px}
  .strip-bar{height:46px;border-radius:8px;margin:2px 0 8px}
  .notation-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
  .notation-card{border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:var(--card)}
  .notation-card span{font-size:11px;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase}
  .notation-card b{display:block;font-family:var(--mono);font-size:15px;margin:2px 0 8px;word-break:break-all}
  .skip-link{position:absolute;left:-9999px;top:0;z-index:100;background:#1B1D21;color:#fff;
    padding:8px 12px;border-radius:0 0 8px 0;text-decoration:none}
  .skip-link:focus{left:0}
  @media(max-width:760px){.topbar{flex-wrap:wrap}.topnav{order:3;width:100%;overflow:auto}.hero h1{font-size:30px}}

  @media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
